name: "CodeQL"

on:
  push:
    branches: [ main, au-0.50.12 ]
  pull_request:
    branches: [ main, au-0.50.12 ]
    paths-ignore:
      - "**/*.pdf"
  schedule:
    # Weekly buildless CodeQL scan of the fork branch (defense-in-depth; dev log 2026-08-20 policy).
    - cron: "0 3 * * 1"

jobs:
  analyze:
    name: Analyze
    strategy:
      fail-fast: false
    runs-on: [ ubuntu-latest ]

    steps:
      - name: "Check out MegaMek"
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: none
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
