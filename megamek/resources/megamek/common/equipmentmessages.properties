# EquipmentInfo.<internalName> = authored mechanics/flavor text for the equipment "info" popup (getFlavorDescription).
# OS custom gear first; IS/Clan (Sarna) descriptions backfilled later.

# --- OS Owl Tactical Network (dev plan 9.7): anti-jam designator datalink ---
EquipmentInfo.OSTacticalNetworkUplink=Owl Tactical Network Uplink (O-X40): an ECM-hardened relay for OS target designators. It carries a designator's collected targeting data back to the C3 network even under standard (Guardian) jamming, to which it is immune. It has no to-hit effect of its own and collects nothing itself - it is dead weight unless the unit also mounts a designator (Kestrel/Shrike/Lodestar) and the friendly C3 network fields an Aegolius Compiler on a C3 Node to receive the feed.
EquipmentInfo.OSAegoliusCompiler=Aegolius Network Targeting Compiler (O-2600): the hub of an Owl network. Mounted on a unit that also carries a C3 Node, it compiles up to six Owl TNU feeds and injects them into the C3 network, letting designators on non-C3 platforms reach the whole net. It is not jam-resistant itself - hostile ECM can suppress it, so protect it with a Guardian or Angel ECM suite on the same C3 Node unit.

# --- OS Combat Computer System (CCS): C-2500 core + weapon-family fire-control (dev plan 9.2) ---
EquipmentInfo.OSCombatComputer=C-2500 Combat Computer core: the 2-ton / 2-slot brain of the Combat Computer System and the prerequisite for every CC module. On its own it grants only the Aimed Shot targeting mode (a called shot at a chosen location) - it gives NO to-hit bonus by itself. Add one or more weapon-family modules, or a Composite unit, to actually buy accuracy.
EquipmentInfo.OSCCBallisticModule=C-2500 Ballistic module: gives every ballistic weapon on the unit a -1 to-hit. Requires the C-2500 core. Its weight scales with the guns it serves - max(1 ton, ceil(total ballistic tonnage / 6)) - and its -1 stacks on top of a network-coordination bonus, so a direct-fire ballistic can reach -2.
EquipmentInfo.OSCCEnergyModule=C-2500 Energy module: -1 to-hit to every energy weapon on the unit. Requires the C-2500 core. Weight = max(1 ton, ceil(total energy tonnage / 8)), the most weight-efficient of the family modules. Stacks with a network-coordination -1.
EquipmentInfo.OSCCMissileModule=C-2500 Missile module: -1 to-hit to every missile weapon on the unit. Requires the C-2500 core. Weight = max(1 ton, ceil(total missile tonnage / 7)). Stacks with a network-coordination -1.
EquipmentInfo.OSCompositeTargetingComputer=C-2500 Composite Targeting Computer: one unit that grants -1 to-hit to ALL weapon types plus the Aimed Shot mode, at a weight of total weapon tonnage / 6. Requires the C-2500 core and is mutually exclusive with the specialized Ballistic/Energy/Missile modules - take broad coverage or lighter per-family modules, not both.

# --- OS Battle Computer System (BCS): B-2500 core, ECM, C3 (dev plan 9.1) ---
EquipmentInfo.OSBattleComputer=B-2500 Battle Computer core: the 2-ton / 2-slot brain of the Battle Computer System and the prerequisite for its ECM and C3 modules. It grants the whole force a constant +1 initiative (raised to +2 on a per-round coordination roll of 12), and on a coordination roll of 10+ feeds the C3 network a -1 to-hit on direct-fire weapons. All of it is ECM-suppressible: a core jammed by hostile ECM with no counter-ECM contributes nothing. One BCS core per unit.
EquipmentInfo.OSGuardianECM=B-2500 Guardian ECM Suite: a standard ECM bubble, OS-lightened to 1 ton / 1 slot, that disrupts hostile C3, Artemis, Narc and active-probe systems within 6 hexes. Requires a B-2500 core.
EquipmentInfo.OSImproveGuardianECM=B-2500 Improve Guardian ECM Suite: the Guardian's full standard ECM bubble squeezed into half a ton / 1 slot - identical jamming at half the weight. Requires a B-2500 core.
EquipmentInfo.OSImproveAngleECM=B-2500 Improve Angle ECM Suite: Angel-grade ECM in 1 ton / 1 slot - a stronger bubble that also mounts ECCM to burn through hostile ECM and resists being countered. Requires a B-2500 core.
EquipmentInfo.OSC3Node=B-2500 C3 Node: a Boosted, ECM-resistant C3 master - it organizes a C3 network whose shared targeting keeps working inside a standard Guardian ECM bubble. Lighter than the canon Boosted C3 Master at 2 tons / 2 slots, and it doubles as a TAG source. Requires a B-2500 core.
EquipmentInfo.OSImproveC3Node=B-2500 Improve C3 Node: the Improve-tier C3 Node - the same Boosted, ECM-resistant C3 master with a wider network (links more Nodes and Points). 2 tons / 2 slots, TAG-capable. Requires a B-2500 core.
EquipmentInfo.OSC3Point=B-2500 C3 Point: a Boosted, ECM-resistant C3 slave - the network endpoint that receives the shared targeting picture and keeps it under standard ECM. 1 ton / 1 slot. Requires a B-2500 core and a C3 Node to command the net.
EquipmentInfo.OSImproveC3Point=B-2500 Improve C3 Point: a Boosted C3 slave that adds focus-fire - while on a C3 network, every networked unit shooting at a target the network has TAG'd gets -1 to-hit. That bonus is network coordination: it does not stack with a Shrike, Kestrel or BCS-roll bonus (only the deepest applies), though a CCS module -1 can still stack on top. 1.5 tons / 1 slot; requires a B-2500 core.

# --- OS BCS Advance combined-EW cores (single-core, replace the B-2500) ---
EquipmentInfo.OSCrowNest=B-2500 Crow Nest EW Core (C-X280): an Advance all-in-one command/EW core that replaces the B-2500 (they are mutually exclusive). It bundles an ECM bubble and an active probe and grants the force a full constant +2 initiative, in 4 tons / 3 slots. (Its pre-battle C3/Raven network lock and integrated C3 Node are still being wired.)
EquipmentInfo.OSRavenCEWS=B-2500 Raven CEWS: an Advance combined ECM + active-probe core that replaces the B-2500, in 2 tons / 2 slots. (Its C3i-style 6-unit egalitarian network and built-in Light TAG are still being wired.)
EquipmentInfo.OSGhostCore=B-2500 Ghost Core (G-X100): an Advance ECM-only core built to coexist with stealth systems - carrying no C3, C3i or active probe, it trips none of the Null-Signature / Chameleon LPS exclusions, so a stealth unit can still field a full ECM bubble. 2 tons / 2 slots, replaces the B-2500.

# --- OS network target designators (C3-network; dead weight off-network) ---
EquipmentInfo.OSKestrelDesignator=Kestrel Network Target Designator: a passive C3-network painter. While its carrier is in an active network and has LOS to a target in range (or a friendly Lodestar beacon is on it), the whole network gets -1 to-hit on direct-fire weapons versus that target - no TAG action required. The Lodestar path also opens network LRM indirect fire on the beaconed target. 4 tons / 3 slots. Its -1 is network coordination (does not stack with Shrike / BCS-roll / Improve C3 Point).
EquipmentInfo.OSShrikeDesignator=Shrike Combat Designator: an Enhanced crit-capable TAG. A successful designation grants every networked unit -1 to-hit against that target this turn, deepening to -3 on a critical designation (a natural 9+). Range 9/12/15, 3 tons / 2 slots. Its bonus is network coordination (does not stack with Kestrel / BCS-roll / Improve C3 Point), but a CCS module -1 can stack on top.
EquipmentInfo.OSDemonHackingSystem=B-2500 Demon Aggressive Hacking System: an Advance offensive-EW designator and the only TAG-type system that can score a critical. A unit hacked this turn takes +1 to-hit whenever it shoots at the hacker's team (+2 if the hack was a critical, natural 9+), and that penalty DOUBLES - to a maximum of +4 - when the victim is also caught inside a hostile Guardian/Angel ECM bubble. Range 5/9/15, 1.5 tons / 1 slot.

# --- OS lasers: Exotic (Binary/Trinary systems + Hyper Laser) ---
EquipmentInfo.OSBinaryLaserSystem=Fires its twin bores as a single 16-point group at 5/10/15 for 16 heat, no to-hit modifier. Resonance Tuning multiplies damage by 1.30 (to 21) against basic standard armor, but the bonus is lost versus Ferro-Fibrous and all advanced/specialized armor - a heavy hitter against conventional targets, ordinary against protected ones.
EquipmentInfo.OSERBinaryLaserSystem=Extended-range Binary: 16 damage at 8/15/22 with a -1 to-hit bonus for 20 heat. Keeps the 1.30x Resonance Tuning (to 21) against standard armor, lost versus Ferro-Fibrous and advanced armor; trades the base Binary's heat efficiency for reach and accuracy.
EquipmentInfo.OSTrinaryLaserSystem=Fires three bores as one 24-point group at 5/10/15 for 24 heat. Resonance Tuning multiplies damage by 1.50 (to 36) against standard armor, but grants nothing versus Ferro-Fibrous or advanced armor - a short-range alpha strike with a heavy heat bill.
EquipmentInfo.OSERTrinaryLaserSystem=Extended-range Trinary: 24 damage at 8/15/22 with -1 to-hit for a steep 32 heat, keeping the 1.50x Resonance Tuning (to 36) against standard armor. Unlike the charge-locked Hyper Laser it can fire every turn, making it the line's sustainable long-range energy alpha.
EquipmentInfo.OSLargeHyperLaser=Experimental extreme-range laser: 25 damage out to 12/24/36/50 with -1 to-hit, aerospace-capable with full AV in every bracket. Must spend at least one turn in Charging mode building charge heat before it can discharge, so it fires only every other turn, and it counts as explosive (12-point cook-off if critically hit).

# --- OS lasers: Large ---
EquipmentInfo.OSERLargeLaser=OS standard extended-range large: 9 damage at 7/14/19 (extreme 28) for 12 heat - a point harder-hitting and longer-reaching than the standard IS ER large laser, at the usual ER heat cost.
EquipmentInfo.OSEnhancedERLargeLaser=Enhanced-tier ER large tuned for accuracy: 11 damage at 8/15/22 with a built-in -1 to-hit for 14 heat in 4.5 tons. Gives up a point of raw damage and runs hotter than the Improve ER large, buying precision and full long-range AV instead.
EquipmentInfo.OSHeavyLargeLaser=Heavy-laser bruiser: 16 damage at 5/10/15 in just 4 tons / 3 slots, the best damage-per-ton in the large class. Pays for it with 18 heat and the Heavy Laser +1 to-hit penalty, favoring short-range brawling over precision fire.
EquipmentInfo.OSImproveHeavyLargeLaser=Improve-tier heavy large: the standard Heavy Large Laser's 16 damage in 4 tons / 3 slots, but with the Heavy Laser +1 to-hit penalty engineered out - full heavy-laser punch at normal accuracy, still at 18 heat.
EquipmentInfo.OSERHeavyLargeLaser=Extended-range heavy large: 16 damage pushed out to 7/14/19 (extreme 28) for a brutal 22 heat, and it keeps the Heavy Laser +1 to-hit penalty. Trades heat and accuracy for heavy-hitter reach.
EquipmentInfo.OSImproveLargePulseLaser=Improve-tier large pulse: 9 damage at 3/7/10 with the full -2 pulse to-hit bonus for 10 heat, trimmed to 6 tons / 2 slots - the accurate short-range brawler of the Improve line.
EquipmentInfo.OSERLargePulseLaser=Pulse accuracy stretched to extended range: 10 damage at 6/12/17 with a -1 to-hit bonus for 14 heat. Reaches a band further than a standard large pulse laser, trading one point of the usual -2 pulse accuracy for that extra distance.
EquipmentInfo.OSImproveERLargePulseLaser=Improve ER large pulse: keeps the full -2 pulse bonus while reaching 6/14/22 (extreme 30) for 11 damage / 14 heat - pulse accuracy at extended range without the accuracy compromise the standard ER pulse makes.
EquipmentInfo.OSEnhancedERLargePulseLaser=Experimental-tier ER large pulse tuned for precision: a -3 to-hit bonus (deeper than the usual -2 pulse) plus 14 damage at 6/14/22 (extreme 30). Pays for the accuracy and reach with 18 heat.
EquipmentInfo.OSHeavyLargePulseLaser=Heavy large pulse: 12 damage at a short 3/6/9 with a -2 pulse bonus for 14 heat. The Heavy Laser trait lifts damage but holds range low - a heavy, accurate knife-fighter.
EquipmentInfo.OSImproveHeavyLargePulseLaser=Improve heavy large pulse: 13 damage with a -2 pulse bonus, the Improve refinement stretching range to a full 5/10/15 - heavy-laser damage plus pulse accuracy without the stunted reach of the standard heavy pulse, at 14 heat.

# --- OS lasers: Medium ---
EquipmentInfo.OSERMediumLaser=OS standard-tier extended-range medium: 6 damage at 4/8/12 for 5 heat in 1 ton / 1 slot - one more point of damage and a longer reach than the baseline medium laser, at 2 more heat and the same weight.
EquipmentInfo.OSEnhancedERMediumLaser=Enhanced-tier ER medium: a heavy 8 damage at 5/10/15 with a built-in -1 to-hit, all in 1 ton / 1 slot for 6 heat. The hardest-hitting medium in the line, tuned for accuracy and reach.
EquipmentInfo.OSHeavyMediumLaser=Heavy medium laser: 10 damage in a single ton at 3/6/9, the best medium damage-per-ton, paid for with 7 heat and the Heavy Laser +1 to-hit penalty. A short-range slugger.
EquipmentInfo.OSImproveHeavyMediumLaser=Improve-tier heavy medium: the same 10 damage / 1 ton as the heavy medium laser but with the Heavy Laser +1 to-hit penalty removed - full damage at normal accuracy, still 7 heat.
EquipmentInfo.OSERHeavyMediumLaser=Extended-range heavy medium: 10 damage out to 4/8/12 (extreme 16) for a heavy 12 heat, keeping the Heavy Laser +1 to-hit penalty. Buys heavy-hitter reach with heat and accuracy.
EquipmentInfo.OSImproveMediumPulseLaser=Improve-tier medium pulse: 6 damage at 3/5/7 with the full -2 pulse to-hit bonus for 4 heat, in a tidy 2 tons / 1 slot.
EquipmentInfo.OSERMediumPulseLaser=Extended-range medium pulse: 7 damage at 4/7/11 (extreme 14) with a -1 to-hit bonus for 6 heat - reaches farther than a standard medium pulse, trading one point of the usual -2 pulse accuracy for the range.
EquipmentInfo.OSImproveERMediumPulseLaser=Improve ER medium pulse: 8 damage at 4/8/12 (extreme 16) with the full -2 pulse bonus for 8 heat - extended range and undiminished pulse accuracy, the refined answer to the standard ER medium pulse's -1.
EquipmentInfo.OSEnhancedERMediumPulseLaser=Experimental-tier ER medium pulse: 10 damage at 4/8/12 (extreme 16) with a deep -3 to-hit bonus for 12 heat - the most accurate medium in the line, at a steep heat cost.
EquipmentInfo.OSHeavyMediumPulseLaser=Heavy medium pulse: 7 damage with a -2 pulse bonus for 5 heat, but the Heavy Laser trait caps range at a very short 2/4/5. A point-blank precision weapon.
EquipmentInfo.OSImproveHeavyMediumPulseLaser=Improve heavy medium pulse: 8 damage with a -2 pulse bonus for 5 heat, the Improve refinement extending range to 3/6/9 - heavy-pulse punch and accuracy without the standard heavy pulse's stunted reach.

# --- OS lasers: Small ---
EquipmentInfo.OSERSmallLaser=OS extended-range small: 4 damage at 2/4/5 (extreme 8) for 2 heat in half a ton - more damage and reach than the standard IS ER small laser.
EquipmentInfo.OSEnhancedERSmallLaser=Enhanced-tier ER small: 5 damage at a long 3/5/8 (extreme 10) with a built-in -1 to-hit, in half a ton for 3 heat - the longest-reaching, most accurate small laser in the line.
EquipmentInfo.OSHeavySmallLaser=Heavy small laser: 6 damage in half a ton at 1/2/3, the best small damage-per-ton, paid for with 3 heat and the Heavy Laser +1 to-hit penalty. A point-blank hole-punch.
EquipmentInfo.OSImproveHeavySmallLaser=Improve-tier heavy small: the heavy small laser's 6 damage in half a ton, with the Heavy Laser +1 to-hit penalty engineered out - full damage at normal accuracy for 3 heat.
EquipmentInfo.OSERHeavySmallLaser=Extended-range heavy small: 6 damage out to 2/4/5 (extreme 8) for 4 heat, keeping the Heavy Laser +1 to-hit penalty. Heavy-hitter reach in the small class, at 1.5 tons.
EquipmentInfo.OSImproveSmallPulseLaser=Improve-tier small pulse: 3 damage at 2/3/5 with the full -2 pulse to-hit bonus for 2 heat - the accurate short-range small of the Improve line.
EquipmentInfo.OSERSmallPulseLaser=Extended-range small pulse: 3 damage at 2/4/6 (extreme 8) with a -1 to-hit bonus for 3 heat - reaches farther than a standard small pulse, trading a point of the usual -2 pulse accuracy for range.
EquipmentInfo.OSImproveERSmallPulseLaser=Improve ER small pulse: 4 damage at 3/5/7 (extreme 10) with the full -2 pulse bonus for 3 heat - extended range and undiminished pulse accuracy in the small class.
EquipmentInfo.OSEnhancedERSmallPulseLaser=Experimental-tier ER small pulse: 5 damage at 3/5/7 (extreme 10) with a deep -3 to-hit bonus for 4 heat - the most accurate small laser in the line.
EquipmentInfo.OSHeavySmallPulseLaser=Heavy small pulse: 4 damage with a -2 pulse bonus for 3 heat in half a ton, the Heavy Laser trait holding range to a point-blank 1/2/3. Accurate and cheap at knife range.
EquipmentInfo.OSImproveHeavySmallPulseLaser=Improve heavy small pulse: 5 damage with a -2 pulse bonus for 3 heat in half a ton - a damage step up over the heavy small pulse while holding the same point-blank 1/2/3 reach.

# --- OS autocannons: Improve LB-X (dual-mode slug or flak-capable cluster) ---
EquipmentInfo.OSImproveLB2XAC=Improve LB 2-X: a 2-point slug or cluster spread at 9/18/27/36 for 1 heat, repackaged into 4.5 tons / 2 slots - the standard LB 2-X's reach and dual-mode flak, lighter.
EquipmentInfo.OSImproveLB5XAC=Improve LB 5-X: a 5-point slug or cluster at 7/14/21/28 for 1 heat, trimmed to 6.5 tons / 4 slots.
EquipmentInfo.OSImproveLB10XAC=Improve LB 10-X: a 10-point slug or cluster at 6/12/18/24 for 2 heat in 10 tons / 5 slots - the workhorse dual-mode autocannon, lighter than the standard LB 10-X.
EquipmentInfo.OSImproveLB20XAC=Improve LB 20-X: a 20-point slug or cluster pushed to 5/10/15/20 for 5 heat in 12 tons / 8 slots - longer-reaching and lighter than the standard LB 20-X.

# --- OS autocannons: Ultra AC (single or ultra double-tap - two rounds, doubled heat; no longer jams) ---
EquipmentInfo.OSImproveUltraAC2=Improve Ultra AC/2: 2 damage at 9/18/25/34 in 6 tons / 2 slots. Fires single or ultra (double-tap: two rounds, doubled heat, no jam); lighter than the standard Ultra AC/2.
EquipmentInfo.OSImproveUltraAC5=Improve Ultra AC/5: 5 damage at 7/14/21/28 in 8 tons / 4 slots, single or ultra double-tap (no jam); lighter than the standard Ultra AC/5.
EquipmentInfo.OSImproveUltraAC10=Improve Ultra AC/10: 10 damage at 6/12/18/24 for 3 heat in 11 tons / 6 slots, single or ultra double-tap (no jam); lighter and cooler than the standard Ultra AC/10.
EquipmentInfo.OSImproveUltraAC20=Improve Ultra AC/20: 20 damage at 4/8/12/16 for 6 heat in 12 tons / 8 slots, single or ultra double-tap (no jam); longer, lighter and cooler than the standard Ultra AC/20.
EquipmentInfo.OSEnhancedUltraAC2=Enhanced Ultra AC/2: 2 damage at 9/18/25/34 with a built-in -1 to-hit, in 6 tons / 2 slots, single or ultra double-tap (no jam) - the Enhanced tier buys accuracy over the Improve Ultra at equal weight.
EquipmentInfo.OSEnhancedUltraAC5=Enhanced Ultra AC/5: 5 damage at a long 8/16/24/32 with a built-in -1 to-hit, in 7 tons / 4 slots, single or ultra double-tap (no jam).
EquipmentInfo.OSEnhancedUltraAC10=Enhanced Ultra AC/10: 10 damage at 7/14/20/27 with a built-in -1 to-hit for 3 heat, in 10 tons / 4 slots, single or ultra double-tap (no jam) - accurate, long, and lean.
EquipmentInfo.OSEnhancedUltraAC20=Enhanced Ultra AC/20: 20 damage at 5/9/13/17 with a built-in -1 to-hit for 6 heat, in 12 tons / 8 slots, single or ultra double-tap (no jam).
EquipmentInfo.OSUltraLB5XAC=Ultra LB 5-X: the LB-X top tier - a 5-point slug or cluster at 8/16/24/32 for 1 heat in 6 tons / 4 slots, with an ultra double-tap mode and access to the OS LB-X special munitions (GAAM guided AP round, Anti-Myomer flechette).
EquipmentInfo.OSUltraLB10XAC=Ultra LB 10-X: a 10-point slug or cluster at 7/14/21/28 for 2 heat in 9 tons / 5 slots, ultra double-tap plus the GAAM and Anti-Myomer special munitions.
EquipmentInfo.OSUltraLB20XAC=Ultra LB 20-X: a 20-point slug or cluster at 5/10/15/20 for 5 heat in 12 tons / 8 slots, ultra double-tap plus the OS LB-X special munitions.

# --- OS autocannons: Rotary (spin-up burst of rounds via the cluster table; risks a jam on a low roll) ---
EquipmentInfo.OSRotaryAC2=Rotary AC/2: fires a burst of 1-6 rounds of 2-point fire (1 heat each) at 7/14/21/28 in 7 tons / 3 slots - sustained fire that stacks into a heavy cluster, risking a jam on a low attack roll.
EquipmentInfo.OSRotaryAC5=Rotary AC/5: a burst of 1-6 rounds of 5-point fire (1 heat each) at 6/12/18/24 in 10 tons / 6 slots; can jam on a low roll.
EquipmentInfo.OSRotaryAC10=Rotary AC/10: fires 1-5 rounds of 10-point fire (3 heat each, up to 15) at 5/10/15/20 in 14 tons / 8 slots; can jam on a low roll.
EquipmentInfo.OSRotaryAC20=Rotary AC/20: the heaviest sustained-fire cannon - 1-4 rounds of 20-point fire (7 heat each, up to 28) at 4/9/13/17 in 16 tons / 12 slots; can jam on a low roll.

# --- OS autocannons: HVAC (long-barrel precision anti-armor; range-scaling to-hit, aerospace-capable, single non-explosive slug) ---
EquipmentInfo.OSImproveHVAC10=Improve HVAC/10: a long-barrel precision autocannon - 10 damage at 8/16/24/32 for 3 heat in 10 tons / 6 slots, with a range-scaling to-hit bonus (0 short / -1 medium / -1 long / -2 extreme) and full aerospace AV. Its accuracy grows with distance.
EquipmentInfo.OSImproveHVAC12=Improve HVAC/12: 12 damage at 7/14/21/28 for 4 heat in 11 tons / 7 slots, with the range-scaling to-hit bonus (medium/long -1, extreme -2) and full aerospace AV.
EquipmentInfo.OSImproveHVAC14=Improve HVAC/14: 14 damage at 7/13/20/27 for 5 heat in 12 tons / 8 slots, range-scaling to-hit (medium/long -1, extreme -2), aerospace-capable.
EquipmentInfo.OSImproveHVAC16=Improve HVAC/16: 16 damage at 6/12/19/26 for 6 heat in 13 tons / 8 slots, range-scaling to-hit (medium/long -1, extreme -2), aerospace-capable - the heaviest-hitting precision HVAC.
EquipmentInfo.OSEnhancedHVAC10=Enhanced HVAC/10: the Improve HVAC/10's 10 damage, ranges and range-scaling to-hit bonus, refined to 8 tons / 4 slots / 2 heat - same precision firepower, lighter and cooler.
EquipmentInfo.OSEnhancedHVAC12=Enhanced HVAC/12: 12 damage at 7/14/21/28 with the range-scaling to-hit bonus, trimmed to 9 tons / 5 slots / 3 heat.
EquipmentInfo.OSEnhancedHVAC14=Enhanced HVAC/14: 14 damage at 7/13/20/27 with the range-scaling to-hit bonus, in 10 tons / 6 slots / 4 heat.
EquipmentInfo.OSEnhancedHVAC16=Enhanced HVAC/16: 16 damage at 6/12/19/26 with the range-scaling to-hit bonus, in 11 tons / 6 slots / 5 heat - precision firepower at the Enhanced tier's reduced weight and heat.

# --- OS Gauss: rifles (min range applies; 1 heat) ---
EquipmentInfo.OSGaussRifle=OS Gauss Rifle: 15 damage at 7/15/22/33 (minimum range 2) for 1 heat, built to Clan weight at 12 tons / 6 slots - as hard-hitting as the IS Gauss but three tons lighter.
EquipmentInfo.OSEnhancedGauss=Enhanced Gauss Rifle: 15 damage at an extreme 9/18/27/40 (min 2) for 1 heat, in 10 tons / 5 slots - the longest-reaching, lightest standard Gauss in the line.
EquipmentInfo.OSLightGauss=Light Gauss Rifle: 8 damage at a long 8/17/25/37 (min 3) for 1 heat in 10 tons / 4 slots - lighter-hitting, longer-reaching Gauss for lean builds.
EquipmentInfo.OSUltraLightGauss=Ultra-Light Gauss Rifle: 6 damage at 7/15/22/33 (min 3) for 1 heat in just 7 tons / 3 slots - the lightest Gauss, for tonnage-starved designs.
EquipmentInfo.OSHeavyGauss=Heavy Gauss Rifle: a range-decaying siege gun - 25 damage up close, 20 at medium, 10 at long - at 6/13/20/30 (min 4) for 2 heat in 16 tons / 10 slots. Devastating in knife range, fading with distance.
EquipmentInfo.OSImproveHeavyGauss=Improve Heavy Gauss Rifle: a flat 22 damage with no range decay at 7/13/20/30 (min 3) for 3 heat in 18 tons / 10 slots - trades the standard Heavy Gauss's brutal short-range spike for consistent damage at every band.
EquipmentInfo.OSEnhancedHeavyGauss=Enhanced Heavy Gauss Rifle: a flat 25 damage with no range decay at 7/14/21/32 (min 3) for 4 heat in 17 tons / 9 slots - full Heavy-Gauss punch held at every range.
EquipmentInfo.OSSuperHeavyGauss=Super-Heavy Gauss Rifle: the biggest single-shot gun in the line - 35 damage up close, 30 at medium, 25 at long - at 6/13/20/30 (min 4) for 5 heat in 22 tons / 14 slots, a range-decaying siege weapon for superheavy chassis.
EquipmentInfo.OSMagshotGauss=Magshot Gauss Rifle: 3 damage at 4/8/12/16 for 1 heat in half a ton / 1 slot - a light Gauss with longer reach than the canon Magshot.
EquipmentInfo.OSAPGauss=Anti-Personnel Gauss Rifle: 3 damage at 3/6/9/12 for 1 heat in half a ton / 1 slot, firing a 2d6 burst against infantry - a dedicated anti-personnel Gauss.

# --- OS Gauss: HAG (cluster Gauss - pellet spread via the cluster table) ---
EquipmentInfo.OSHAG20=HAG/20: a cluster Gauss throwing a 20-pellet spread at a long 9/17/25/33 (min 2) for 3 heat in 7 tons / 6 slots - cooler and longer-ranged than the Clan Hyper-Assault Gauss.
EquipmentInfo.OSHAG30=HAG/30: a 30-pellet cluster Gauss at 9/17/25/33 (min 2) for 5 heat in 11 tons / 8 slots, cooler and longer-reaching than the Clan HAG.
EquipmentInfo.OSHAG40=HAG/40: a 40-pellet cluster Gauss at 9/17/25/33 (min 2) for 7 heat in 14 tons / 10 slots.
EquipmentInfo.OSHHAG30=Heavy HAG/30: a heavier 30-pellet cluster Gauss reaching 10/20/30/40 (min 2) for 8 heat in 15 tons / 10 slots, its handler adding +2 to the cluster roll for a denser spread than the standard HAG.
EquipmentInfo.OSHHAG40=Heavy HAG/40: a 40-pellet cluster Gauss at the longest 10/20/30/40 (min 2) for 10 heat in 19 tons / 13 slots, with a +2 cluster-roll bonus - the densest, longest-reaching cluster gun.

# --- OS Gauss: LB-X Gauss (dual-mode slug or cluster) ---
EquipmentInfo.OSLBXGauss=LB-X Gauss Rifle: a dual-mode Gauss - a 15-point slug or a 15-pellet cluster spread - at 7/15/22/33 (min 2) for 1 heat in 15 tons / 7 slots, combining Gauss reach with LB-X flak flexibility.
EquipmentInfo.OSImproveLBXGauss=Improve LB-X Gauss Rifle: the LB-X Gauss's 15-point slug/cluster pushed to 8/16/24/36 (min 2) and trimmed to 13 tons / 6 slots - lighter and longer.
EquipmentInfo.OSHeavyLBXGauss=Heavy LB-X Gauss Rifle: a 20-point slug or 20-pellet cluster at 6/13/20/30 (min 3) for 2 heat in 19 tons / 11 slots - the heavy dual-mode Gauss.

# --- OS electromagnetic: Advance coil apex ---
EquipmentInfo.OSElectromagneticLance=Electromagnetic Lance: an Advance coil supergun with power-gated munitions. Full-power rounds fire a 20-point inherent-AP kinetic slug at a long 9/18/26/34 (min 3); throttled-down rounds collapse to 5/10/15/20 and lose AP to survive launch, delivering payloads - Flak, Flechette, Precision (-2 vs target movement) or Incendiary. 3 heat, 18 tons / 11 slots.
EquipmentInfo.OSCoilAugmentedRailgun=Coil Augmented Railgun: the Advance kinetic apex - a flat 30-damage inherent-AP slug (through-armor crit) at 9/18/27/36, no minimum range, 6 heat, 22 tons / 13 slots. Fires stably for its first 12 shots; past that it takes +2 to-hit and jams on a natural 2, and accumulated jams scrap the barrel at +5. The one-way Shed Barrel mode drops it to a rock-steady short-range 25-damage brawler (4/6/9/12, no AP, no wear).

# --- OS machine guns & machine cannons (anti-infantry; extended ranges vs canon) ---
EquipmentInfo.OSMachineGun=Machine Gun: 2 damage at 2/4/6/8 (double the canon MG's reach) for no heat in half a ton, firing a 2d6 burst against infantry at 200 shots/ton.
EquipmentInfo.OSLightMG=Light Machine Gun: 1 damage at 3/6/9/12 (about 50% longer than canon) for no heat in half a ton, 1d6 anti-infantry burst, 200 shots/ton.
EquipmentInfo.OSHeavyMG=Heavy Machine Gun: 3 damage at 2/4/6/8 (triple the canon reach) for no heat in 1 ton, 3d6 anti-infantry burst, 100 shots/ton.
EquipmentInfo.OSMGA=Machine Gun Array: links 2-4 OS Machine Guns to fire as one weapon (Linked/Off), concentrating their anti-infantry burst. BV 0 - value is priced into the linked MGs.
EquipmentInfo.OSLightMGA=Light Machine Gun Array: links 2-4 OS Light MGs into one linked burst weapon (Linked/Off) in a quarter-ton mount. BV 0.
EquipmentInfo.OSHeavyMGA=Heavy Machine Gun Array: links 2-4 OS Heavy MGs into one linked burst weapon (Linked/Off). BV 0.
EquipmentInfo.OSMachineCannon=Machine Cannon: fills the dead zone between MG and autocannon - 3 damage at 3/6/9/12 for 1 heat in 1.5 tons / 2 slots, with a heavy 6d6 anti-infantry burst and support for Flak munitions.
EquipmentInfo.OSHeavyMachineCannon=Heavy Machine Cannon: the heavier sibling - 5 damage at 2/5/8/11 for 2 heat in 2.5 tons / 3 slots, a punishing 10d6 anti-infantry burst plus Flak munition support.

# --- OS PPCs (standard PPC/ER PPC are IS-value replicas; plain Improve PPC / Improve ER PPC omitted - no special mechanic) ---
EquipmentInfo.OSEnhancedERPPC=Enhanced ER PPC: 15 damage at 7/14/23/30 with no minimum range, for 15 heat in 6 tons / 2 slots - half again the damage of a standard ER PPC, lighter, and free of the minimum-range dead zone.
EquipmentInfo.OSHeavyPPC=Heavy PPC: 18 damage at 6/12/18/24 (minimum range 3) for 18 heat in 8 tons / 4 slots - a heavier-hitting particle cannon than the standard PPC.
EquipmentInfo.OSERHeavyPPC=ER Heavy PPC: the Heavy PPC's 18 damage pushed to 7/14/20/27 with no minimum range, for a hot 22 heat in 9 tons / 4 slots - heavy punch at extended range.
EquipmentInfo.OSLightPPC=Light PPC: 7 damage at 6/12/18/24 (minimum range 3) for 7 heat in just 3 tons / 2 slots - a light particle cannon, harder-hitting than the canon Light PPC.
EquipmentInfo.OSSnubNosePPC=Snub-Nose PPC: range-graded damage - 10 up close, 8 at medium, 6 at long - at 9/13/15/22 with no minimum range, for 10 heat in 6 tons / 2 slots. Trades reach for a dead-zone-free brawl; counts as explosive (cooks off if critically hit).
EquipmentInfo.OSHeavySnubNosePPC=Heavy Snub-Nose PPC: range-graded 15/9/6 damage (short/medium/long) at 9/12/14/21 with no minimum range, for 15 heat in 8 tons / 4 slots - a heavy close-range particle cannon; explosive.
EquipmentInfo.OSHyperPPC=Hyper PPC: an experimental 30-damage particle cannon at a long 12/24/36/50 (minimum range 3) with a built-in -1 to-hit, for a punishing 30 heat in 10 tons / 7 slots. Must spend a turn in Charging mode before it can discharge, so it fires only every other turn.
EquipmentInfo.OSRotaryLightPPC=Rotary Light PPC: a spin-up particle cannon firing 1-5 shots of 5 damage at 6/12/18/24 in 7 tons / 5 slots. The first three shots are self-cooled (2 heat each); the 4th-5th draw from a linked RPPC Coolant Pod, and firing 4+ without a charged pod overloads the weapon.
EquipmentInfo.OSRotarySnubNosePPC=Rotary Snub-Nose PPC: a rotary snub-nose firing up to 4 range-graded shots (8/6/4 by range) at 8/12/15/22 with no minimum range, in 10 tons / 6 slots. The first three shots self-cool (3 heat each); the 4th draws a linked RPPC Coolant Pod charge, and firing without one overloads the weapon.
EquipmentInfo.OSPPCX=PPC-X: disperses into 6 sub-beams of 2 damage (up to 12, resolved on the cluster table) at 7/10/13/18 with no minimum range, for 10 heat in 6 tons / 3 slots. Carries a range-scaling to-hit gradient (-1 short / +0 medium / +1 long) and counts as explosive.
EquipmentInfo.OSHeavyPPCX=Heavy PPC-X: 6 sub-beams of 4 damage (up to 24, cluster table) at 7/10/13/18 with no minimum range, for 15 heat in 8 tons / 4 slots, with the same range-scaling to-hit gradient; explosive.

# --- OS plasma (ammo-fed; floods the target with heat rather than relying on armor damage) ---
EquipmentInfo.OSPlasmaRifle=Plasma Rifle: a focused bolt dealing 10 damage AND flooding the target with 2d6 extra heat, at 6/12/18/24 for 8 heat in 5 tons / 2 slots. Ammo-fed; runs cooler, lighter and longer-ranged than the canon IS Plasma Rifle.
EquipmentInfo.OSPlasmaCannon=Plasma Cannon: a diffuse-burst area weapon - it deals NO armor damage to meks but floods them with 2d6 heat, and shreds infantry/vehicles with a 3d6 cluster, at 6/12/18/24 for 6 heat in 4 tons / 2 slots. Ammo-fed; the area-suppression counterpart to the focused Plasma Rifle.
EquipmentInfo.OSHeavyPlasmaRifle=Heavy Plasma Rifle: breaks the 10-point plasma ceiling - 15 damage plus 2d6 target heat at a short 5/10/15/20, for a hot 12 heat and a +1 to-hit penalty, in 7 tons / 3 slots. Ammo-fed; a short-range, inaccurate armor-cracker.
EquipmentInfo.OSHeavyPlasmaCannon=Heavy Plasma Cannon: a denser area heat-flood - no mek armor damage but 3d6 heat (vs the standard cannon's 2d6), plus a 3d6 anti-soft cluster, at 6/12/18/24 for 10 heat and a +1 to-hit penalty, in 6 tons / 3 slots. Ammo-fed.
EquipmentInfo.OSEMPPlasmaAccelerator=EMP Plasma Accelerator: a dedicated electronic-disruption weapon dealing 0 damage - its ionized stream causes INTERFERENCE only (never a full shutdown) at 5/10/15/20 for 8 heat in 5 tons / 3 slots. Ammo-fed; unlike a TSEMP the firing unit suffers no self-interference.

# --- OS LRM (OS core LRM carry a -1 to-hit in the long bracket; indirect-fire capable. Standard/Improve SRM omitted - no special mechanic) ---
EquipmentInfo.OSHeavyLRM10=Heavy LRM 10: 10 missiles at 7/14/24 (min 6, ext 30) with the OS -1 long-bracket to-hit, 4 heat, 5t / 2 slots. Single or Ultra fire (Ultra = two volleys in one turn, doubled ammo and heat; no jam).
EquipmentInfo.OSHeavyLRM20=Heavy LRM 20: 20 missiles at 7/14/24 (min 6, ext 30), -1 long bracket, 6 heat, 10t / 5 slots. Single or Ultra double-volley (no jam).
EquipmentInfo.OSHeavyLRM30=Heavy LRM 30: 30 missiles at 7/14/24 (min 6, ext 30), -1 long bracket, 9 heat, 14t / 7 slots. Single or Ultra double-volley (no jam).
EquipmentInfo.OSImproveLRM5=Improve LRM 5: an OS-light 5-missile rack at 7/14/24 (min 6, ext 30) with the -1 long-bracket to-hit, 2 heat, 1.5t / 1 slot. Indirect-fire capable.
EquipmentInfo.OSImproveLRM10=Improve LRM 10: 10 missiles at 7/14/24 (min 6, ext 30), -1 long bracket, 4 heat, 3t / 2 slots.
EquipmentInfo.OSImproveLRM15=Improve LRM 15: 15 missiles at 7/14/24 (min 6, ext 30), -1 long bracket, 5 heat, 5t / 3 slots.
EquipmentInfo.OSImproveLRM20=Improve LRM 20: 20 missiles at 7/14/24 (min 6, ext 30), -1 long bracket, 6 heat, 7t / 5 slots.
EquipmentInfo.OSEnhancedLRM5=Enhanced LRM 5: a Clan-weight 5-rack with the -1 long bracket AND no minimum range (7/14/24, ext 30), 2 heat, 1t / 1 slot - the dead-zone-free step above the Improve LRM.
EquipmentInfo.OSEnhancedLRM10=Enhanced LRM 10: 10 missiles, -1 long bracket, no minimum range (7/14/24, ext 30), 4 heat, 2.5t / 1 slot.
EquipmentInfo.OSEnhancedLRM15=Enhanced LRM 15: 15 missiles, -1 long bracket, no minimum range (7/14/24, ext 30), 5 heat, 3.5t / 2 slots.
EquipmentInfo.OSEnhancedLRM20=Enhanced LRM 20: 20 missiles, -1 long bracket, no minimum range (7/14/24, ext 30), 6 heat, 5t / 4 slots.
EquipmentInfo.OSERLRM10=ER LRM 10: an extreme-reach LRM at 12/22/38 for 6 heat in 6t / 3 slots, Artemis IV-capable - trades the core LRM's long-bracket bonus for raw distance.
EquipmentInfo.OSERLRM15=ER LRM 15: 15 missiles at 12/22/38, 9 heat, 9t / 5 slots, Artemis-capable.
EquipmentInfo.OSERLRM20=ER LRM 20: 20 missiles at 12/22/38, 12 heat, 13t / 6 slots, Artemis-capable.

# --- OS Heavy SRM (Ultra double-fire, no jam; extended 4/8/12 range) ---
EquipmentInfo.OSHeavySRM4=Heavy SRM 4: a 4-tube SRM at an extended 4/8/12 (ext 16), 3 heat, 3t / 2 slots. Single or Ultra fire (two volleys, doubled ammo and heat; no jam) - longer-reaching than the standard SRM.
EquipmentInfo.OSHeavySRM6=Heavy SRM 6: 6 tubes at 4/8/12 (ext 16), 4 heat, 4.5t / 3 slots. Single or Ultra double-volley (no jam).
EquipmentInfo.OSHeavySRM8=Heavy SRM 8: 8 tubes at 4/8/12 (ext 16), 5 heat, 6t / 4 slots. Single or Ultra double-volley (no jam).
EquipmentInfo.OSHeavySRM12=Heavy SRM 12: 12 tubes at 4/8/12 (ext 16), 7 heat, 9t / 5 slots. Single or Ultra double-volley (no jam).

# --- OS Improve MRM (medium-range specialist: -1 to-hit across the huge medium bracket; a linked Diana III FCS adds another -1) ---
EquipmentInfo.OSImproveMRM10=Improve MRM 10: a 10-missile medium-range rack at 3/13/16 (min 0, ext 20) with a -1 to-hit across the huge medium bracket, 4 heat, 3t / 2 slots. A linked Diana III FCS stacks a further -1.
EquipmentInfo.OSImproveMRM20=Improve MRM 20: 20 missiles at 3/13/16 (ext 20), -1 medium bracket, 6 heat, 7t / 3 slots (Diana III adds -1).
EquipmentInfo.OSImproveMRM30=Improve MRM 30: 30 missiles at 3/13/16 (ext 20), -1 medium bracket, 10 heat, 9.5t / 5 slots (Diana III adds -1).
EquipmentInfo.OSImproveMRM40=Improve MRM 40: 40 missiles at 3/13/16 (ext 20), -1 medium bracket, 12 heat, 12t / 7 slots (Diana III adds -1).

# --- OS MML (dual-mode: fires both LRM ammo (7/14/21) and SRM ammo; Improve MML omitted - lighter base MML, no distinct rule) ---
EquipmentInfo.OSMML5=MML 5: a dual-mode launcher firing either LRM ammo (7/14/21, min 6) or SRM ammo at short range, rack 5, 3 heat, 2.5t / 3 slots - lighter than the IS MML.
EquipmentInfo.OSMML7=MML 7: dual LRM/SRM launcher, rack 7, 4 heat, 4t / 3 slots.
EquipmentInfo.OSMML9=MML 9: dual LRM/SRM launcher, rack 9, 5 heat, 5t / 4 slots.
EquipmentInfo.OSHeavyMML5=Heavy MML 5: a dual-mode LRM/SRM launcher with Single or Ultra double-fire (two volleys, doubled ammo and heat; no jam), rack 5, 6 heat, 4t / 3 slots.
EquipmentInfo.OSHeavyMML8=Heavy MML 8: dual LRM/SRM, Single or Ultra double-fire (no jam), rack 8, 8 heat, 6.5t / 4 slots.
EquipmentInfo.OSHeavyMML11=Heavy MML 11: dual LRM/SRM, Single or Ultra double-fire (no jam), rack 11, 12 heat, 9t / 6 slots.
EquipmentInfo.OSHeavyMML14=Heavy MML 14: dual LRM/SRM, Single or Ultra double-fire (no jam), rack 14, 14 heat, 12t / 7 slots.
EquipmentInfo.OSMML3=MML 3: a dual-mode launcher firing LRM ammo (7/14/21, min 6) or SRM ammo at short range, rack 3, 2 heat, 1.25t / 2 slots - the lightest MML.

# --- OS Streak missiles (lock-on: fires and consumes ammo only on a lock, then the whole salvo hits with no cluster roll. Improve Streak LRM omitted - lighter only) ---
EquipmentInfo.OSStreakLRM5=Streak LRM 5: a lock-on 5-rack at 7/14/24 (min 6, ext 30) - fires only on a lock, then every missile hits, 2 heat, 2.5t / 1 slot. No long-bracket bonus; its edge is guaranteed hits.
EquipmentInfo.OSStreakLRM10=Streak LRM 10: lock-on full salvo at 7/14/24 (min 6, ext 30), 4 heat, 6t / 2 slots.
EquipmentInfo.OSStreakLRM15=Streak LRM 15: lock-on full salvo, 7/14/24 (min 6), 6 heat, 8.5t / 3 slots.
EquipmentInfo.OSStreakLRM20=Streak LRM 20: lock-on full salvo, 7/14/24 (min 6), 8 heat, 11t / 4 slots.
EquipmentInfo.OSExtendedStreakLRM10=Extended Streak LRM 10: lock-on full salvo at an extreme 12/22/38 (min 10, ext 57), 6 heat, 8t / 4 slots - apex reach plus guaranteed hits.
EquipmentInfo.OSExtendedStreakLRM15=Extended Streak LRM 15: lock-on full salvo at 12/22/38 (min 10), 9 heat, 11t / 6 slots.
EquipmentInfo.OSExtendedStreakLRM20=Extended Streak LRM 20: lock-on full salvo at 12/22/38 (min 10), 12 heat, 14t / 8 slots.
EquipmentInfo.OSStreakSRM2=Streak SRM 2: a lock-on 2-tube SRM at 3/6/9 (ext 12) - fires only on a lock, then both missiles hit, 2 heat, 1.25t / 1 slot.
EquipmentInfo.OSStreakSRM4=Streak SRM 4: lock-on full salvo, 3/6/9 (ext 12), 3 heat, 2.5t / 1 slot.
EquipmentInfo.OSStreakSRM6=Streak SRM 6: lock-on full salvo, 3/6/9 (ext 12), 4 heat, 3.75t / 2 slots.
EquipmentInfo.OSStreakSRM8=Streak SRM 8: lock-on full salvo, 3/6/9 (ext 12), 6 heat, 5t / 3 slots.
EquipmentInfo.OSImproveStreakSRM2=Improve Streak SRM 2: a Clan-grade lock-on SRM with extended 4/8/12 range at Clan weight, 2 heat, 1t / 1 slot - longer reach than the base Streak SRM.
EquipmentInfo.OSImproveStreakSRM4=Improve Streak SRM 4: Clan-grade lock-on, 4/8/12 (ext 16), 3 heat, 2t / 1 slot.
EquipmentInfo.OSImproveStreakSRM6=Improve Streak SRM 6: Clan-grade lock-on, 4/8/12 (ext 16), 4 heat, 3t / 2 slots.
EquipmentInfo.OSImproveStreakSRM8=Improve Streak SRM 8: Clan-grade lock-on, 4/8/12 (ext 16), 6 heat, 4t / 3 slots.
EquipmentInfo.OSStreakMML5=Streak MML 5: a dual-mode LRM/SRM launcher with Streak lock-on (guaranteed hits), 7/14/21 (min 6) in LRM mode, 3 heat, 3.5t / 3 slots. Not Artemis-compatible.
EquipmentInfo.OSStreakMML7=Streak MML 7: dual-mode LRM/SRM lock-on launcher, 4 heat, 5t / 4 slots.
EquipmentInfo.OSStreakMML9=Streak MML 9: dual-mode LRM/SRM lock-on launcher, 5 heat, 6t / 5 slots.
EquipmentInfo.OSStreakMML11=Streak MML 11: dual-mode LRM/SRM lock-on launcher, 6 heat, 6.5t / 5 slots.
EquipmentInfo.OSStreakMRM10=Streak MRM 10: a lock-on MRM at 3/13/16 (ext 20) - guaranteed hits, but deliberately heavy/bulky to force a real tradeoff, 4 heat, 6t / 3 slots.
EquipmentInfo.OSStreakMRM20=Streak MRM 20: lock-on MRM, 3/13/16 (ext 20), 6 heat, 12t / 5 slots.
EquipmentInfo.OSStreakMRM30=Streak MRM 30: lock-on MRM, 3/13/16 (ext 20), 9 heat, 17t / 7 slots.

# --- OS ATM (variable payloads: loads long-range LRTM, standard SRTM, or short high-explosive APTM ammo, each with its own range/damage profile) ---
EquipmentInfo.OSATM3=ATM 3: a variable-payload launcher - loads Extended (LRTM), Standard (SRTM) or High-Explosive (APTM) ammo, each shifting range and per-missile damage. Base rack 3, 2 heat, 1.5t / 1 slot.
EquipmentInfo.OSATM6=ATM 6: variable LRTM/SRTM/APTM payloads, rack 6, 4 heat, 3.5t / 3 slots.
EquipmentInfo.OSATM9=ATM 9: variable LRTM/SRTM/APTM payloads, rack 9, 6 heat, 5t / 4 slots.
EquipmentInfo.OSATM12=ATM 12: variable LRTM/SRTM/APTM payloads, rack 12, 8 heat, 7t / 5 slots.
EquipmentInfo.OSImproveATM3=Improve ATM 3: an iATM-class upgrade of the ATM - richer payload options and higher performance at the same rack, 2 heat, 1.5t / 1 slot.
EquipmentInfo.OSImproveATM6=Improve ATM 6: iATM-class, richer payloads, rack 6, 4 heat, 3.5t / 3 slots.
EquipmentInfo.OSImproveATM9=Improve ATM 9: iATM-class, richer payloads, rack 9, 6 heat, 5t / 4 slots.
EquipmentInfo.OSImproveATM12=Improve ATM 12: iATM-class, richer payloads, rack 12, 8 heat, 7t / 5 slots.

# --- OS Dragon Piercer (a single large armor-piercing warhead, not a cluster - concentrates all damage in one location with a through-armor critical) ---
EquipmentInfo.OSDragonPiercer5=Dragon Piercer 5: a single concentrated 5-point warhead at 5/10/15 with an armor-piercing breach (through-armor crit on 8+), 3 heat, 3t / 2 slots - a Thunderbolt-style AP strike, not a cluster.
EquipmentInfo.OSDragonPiercer10=Dragon Piercer 10: a single 10-point AP warhead at 10/15/20, breach on 8+, 5 heat, 7t / 2 slots.
EquipmentInfo.OSDragonPiercer15=Dragon Piercer 15: a single 15-point AP warhead at 15/20/25, breach on 8+, 7 heat, 9t / 3 slots.
EquipmentInfo.OSDragonPiercer20=Dragon Piercer 20: a single 20-point AP warhead at 20/25/30, breach on 8+, 10 heat, 11t / 3 slots.
EquipmentInfo.OSImproveDragonPiercer5=Improve Dragon Piercer 5: a lighter Dragon Piercer with a deeper breach (through-armor crit on 7+), single 5-point warhead at 5/10/15, 3 heat, 2.5t / 2 slots.
EquipmentInfo.OSImproveDragonPiercer10=Improve Dragon Piercer 10: single 10-point AP warhead, breach on 7+, 10/15/20, 5 heat, 5.5t / 2 slots.
EquipmentInfo.OSImproveDragonPiercer15=Improve Dragon Piercer 15: single 15-point AP warhead, breach on 7+, 15/20/25, 7 heat, 7.5t / 3 slots.
EquipmentInfo.OSImproveDragonPiercer20=Improve Dragon Piercer 20: single 20-point AP warhead, breach on 7+, 20/25/30, 10 heat, 9.5t / 3 slots.

# --- OS Narc / beacons (attach a homing pod to a target so friendly missiles home in; deal no damage themselves) ---
EquipmentInfo.OSNarc=Narc Missile Beacon: fires a homing pod that sticks to the target, letting friendly Narc-capable missiles home on it (guaranteed cluster hits). 0 damage, 3/6/9/12, 3t / 2 slots.
EquipmentInfo.OSSeekerBeacon=Seeker Missile Beacon: a lightweight Narc beacon firing the same homing pods, 0 damage, 3/6/9/12, 2.5t / 2 slots.
EquipmentInfo.OSMuninBeacon=Munin Missile Beacon: an iNarc-class multi-pod beacon at extended 4/9/15/18 range - fires Homing, ECM, Haywire or Nemesis pods, 0 damage, 5t / 3 slots.

# --- OS flamers (energy-fed, no ammo; Damage mode burns armor, Heat mode pumps heat into a mek; XdY burst vs infantry) ---
EquipmentInfo.OSImproveFlamer=Improve Flamer: 2 damage / 2 heat at 1/2/3, 0.5t / 1 slot, 4d6 vs infantry - the efficiency model, running at half the standard flamer's heat-to-fire (3) in half a ton.
EquipmentInfo.OSERFlamer=ER Flamer: 2 damage / 3 heat at 3/6/9, 1t / 1 slot, 2d6 vs infantry - reaches well past the IS ER Flamer's 3/5/7.
EquipmentInfo.OSHeavyFlamer=Heavy Flamer: 5 damage / 6 heat at 2/4/6, 1.5t / 1 slot, 6d6 vs infantry. The damage model, and unlike the canon Heavy Flamer it is fully energy-fed - no plastic-fuel ammo.
EquipmentInfo.OSERHeavyFlamer=ER Heavy Flamer: 5 damage / 7 heat at 3/6/9, 2t / 1 slot, 6d6 vs infantry - the heaviest OS flamer, pairing heavy damage with extended reach; the 7 heat-to-fire is its real limiter.

# --- OS movement enhancers: MASC & Supercharger families (Armed/Off; boost run/sprint MP, risk a rising 2d6 failure) ---
EquipmentInfo.OSMASC=MASC: Armed, the Myomer Accelerator Signal Circuitry boosts running/sprinting MP; each activation risks a rising 2d6 failure that locks the legs and damages actuators. The OS baseline runs at Clan-grade weight (variable by engine rating).
EquipmentInfo.OSImproveMASC=Improve MASC: a more reliable MASC that fails on a gentler curve (the lower alternate-MASC target) than the baseline, at reduced mass and slots.
EquipmentInfo.OSHeavyDutyMASC=Heavy Duty MASC: the survival-focused MASC - the gentlest failure curve (the enhanced alternate target) in a reinforced build.
EquipmentInfo.OSSupercharger=Supercharger: an engine-mounted MP booster in a single slot; Armed, it adds run/sprint MP and risks a 2d6 failure. Even the OS baseline caps failure damage at 2 engine hits (canon superchargers can take 3).
EquipmentInfo.OSImproveSupercharger=Improve Supercharger: lighter and more reliable - a gentler failure curve on top of the OS 2-hit engine-damage cap.
EquipmentInfo.OSHeavyDutySupercharger=Heavy Duty Supercharger: the most fail-safe MP booster - gentlest failure curve, a 2-slot reinforced build, and a redundant subsystem that fully absorbs the first failure each scenario (no engine damage, and the supercharger survives).

# --- OS heat sinks (single-family dissipation ladder beyond the double heat sink) ---
EquipmentInfo.OSImprovedDoubleHeatSink=Improved Double Heat Sink: dissipates 2 heat in 1 ton / 2 slots - Clan-grade packaging (2 crits, not the IS double's 3). The OS baseline of the heat-sink ladder.
EquipmentInfo.OSTripleHeatSink=Triple Heat Sink: dissipates 3 heat in 1 ton / 2 slots - 50% more cooling per sink than a double, an OS-original step on the ladder.
EquipmentInfo.OSQuadrupleHeatSink=Quadruple Heat Sink: dissipates 4 heat in 1 ton / 3 slots - twice a double heat sink's cooling per sink, the Experimental apex of OS thermal tech.

# --- OS chassis mods ---
EquipmentInfo.OSImprovedAES=Improved Actuator Enhancement System (AES-I): a whole-Mek mobility system (not the canon per-limb device) - it gives -1 to the attacker's movement-based to-hit whenever the Mek RAN or JUMPED, and cancels the MP penalties of Hardened/Modular Armor. Weight = 5% of Mek mass, crits by weight class (L1/M2/H3/A4). Mek-only, omni-fixed.
EquipmentInfo.OSImprovedArmoredMotiveSystem=Improved Armored Motive System (AMS-I): a combat/support-vehicle chassis mod that armors the drivetrain for -2 on the motive-system damage roll, at Clan weight (10% of vehicle mass). NOT the Anti-Missile System - this protects the vehicle's movement.

# --- OS missile fire-control (mount beside a launcher to enhance it) ---
EquipmentInfo.OSDianaIII=Diana III FCS: an MRM-dedicated fire-control system (the OS answer to Apollo) - it gives OS MRM launchers BOTH a cluster-roll bonus AND an extra -1 to-hit. 1t / 1 slot.
EquipmentInfo.OSOrionV=Orion V FCS: a high-end integration FCS - +3 to the cluster roll on cluster missiles (vs Artemis IV's +2), or on Streak launchers instead assists the lock (-1 to the lock roll and immunity to standard ECM lock-breaking). 1.5t / 2 slots, Advance tier.

# --- OS defensive systems (spread-crit; destroying any one component disables the whole system) ---
EquipmentInfo.OSEARS=EARS (Emergency Armor Repair System): repairs armor at end of round - 10% of the Mek's total armor per trigger. It fires when the Mek took 30+ damage that round (repair spread evenly over damaged locations) and/or 15+ to a single location (repair concentrated there); each trigger spends a charge (up to 2/round). Weighs 2.5% of Mek mass, spread across the chassis.
EquipmentInfo.OSEARSComponent=EARS component: an auto-placed, hittable piece of the Emergency Armor Repair System (see EARS). Destroying any one component disables the whole system.
EquipmentInfo.OSDDS=DDS (Damage Distribution System): spends a charge to absorb an incoming critical hit before it lands - excluding ammo explosions and hits on its own components, and only while the struck location still has structure. Weighs 1.5% of Mek mass, spread across the chassis.
EquipmentInfo.OSDDSComponent=DDS component: an auto-placed, hittable piece of the Damage Distribution System (see DDS). Destroying any one component disables the whole system.
EquipmentInfo.OSPFD=Particle Field Damper: while On, it soaks incoming energy fire - PPC damage -50%, other energy weapons -10% (min 1). Runs hot: after 8 straight rounds active it must roll each round to keep working, and any of its 5 spread crit slots destroyed fails the whole system. 3t, explosive.
EquipmentInfo.OSAdvPFD=Advanced Particle Field Damper: the upgraded damper - PPC damage -50%, other energy -20% (min 1) while On, at 2 tons. Same 8-round endurance roll and 5 spread crit slots (any destroyed = system failure); explosive. Advance tier.
